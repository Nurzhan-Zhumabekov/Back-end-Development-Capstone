{% extends "base.html" %}
{% block content %}
<h2>Songs</h2>
{% if error %}
<p class="alert alert-warning" role="alert">{{ error }}</p>
{% else %}
  {% for song in songs %}
  <div class="section-bg mb-3 p-3">
    <button type="button" class="btn btn-link" data-bs-toggle="modal"
            data-bs-target="#song{{ song.id }}">{{ song.title }}</button>
    <div class="modal" id="song{{ song.id }}" tabindex="-1"
         aria-labelledby="title{{ song.id }}" aria-hidden="true">
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h3 class="modal-title h5" id="title{{ song.id }}">{{ song.title }} — Lyrics</h3>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body"><p class="multiline">{{ song.lyrics }}</p></div>
        </div>
      </div>
    </div>
  </div>
  {% empty %}<p>No songs are available yet.</p>{% endfor %}
{% endif %}
{% endblock %}
