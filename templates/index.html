{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="d-flex align-items-center p-4 p-md-5"
     style="min-height: 65vh; background: linear-gradient(#0008, #000a),
     url('{% static 'images/img.jpeg' %}') center / cover;">
  <div class="text-white" style="max-width: 34rem;">
    <h2 class="display-3 fw-bold">Djirection</h2>
    <p class="lead">Explore the songs, concert photos, and upcoming shows of the five-piece band.</p>
    <a class="btn btn-light" href="{% url 'songs' %}">Browse songs</a>
    <a class="btn btn-outline-light" href="{% url 'photos' %}">See photos</a>
  </div>
</div>
{% endblock %}
